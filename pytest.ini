[pytest]
# The package has no __init__.py and is not installed, so the repo root has to be on sys.path
# for `finiexragengine.*` to import. It used to arrive from the environment — PYTHONPATH in
# docker-compose and in the CI workflow — which meant a bare `pytest` worked in the container and
# failed anywhere else (found on the live Windows host, 2026-08-17). Declaring it here makes the
# suite runnable from a plain checkout, with no environment to remember.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -m "not paid"
markers =
    paid: calls a paid external API (OpenAI); excluded by default — run deliberately with -m paid
    deploy: can only fail on the deployed platform — run on the production machine at a version
        bump (`pytest -m deploy`). The criterion is a dependency this suite ENCODES but a Linux
        container cannot EXERCISE: an event loop implementation, a console codepage, a socket
        deadline, a subprocess, a path separator. Two such defects shipped green on 2026-08-28 —
        the stream tail could not open an async psycopg connection under Windows' ProactorEventLoop
        and pushed nothing for 22 hours, and the mock generator had never run on Windows at all.
        Not a substitute for the full run the release rule requires; a fast gate for the classes
        that have actually bitten.
